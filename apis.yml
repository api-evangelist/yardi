notes: |
  Corrected 2026-07-28 after a fresh review of Yardi's actual public posture.

  Removed as fabricated — these paths were catalogued but do not exist:
    - https://www.yardi.com/platform/                     (HTTP 404, was "Portal")
    - https://www.yardi.com/platform/api/                 (HTTP 404, was "Documentation"
                                                           on 5 entries and "Developer
                                                           Resources" in common)
    - https://www.yardi.com/platform/api/authentication/  (HTTP 404, was "Authentication"
                                                           on 5 entries)
    - https://www.yardi.com/platform/api/maintenance/     (HTTP 404)
    - https://www.yardi.com/platform/api/investment/      (redirects to a marketing page,
                                                           not API documentation)
    - baseURL https://api.yardi.com                       (does not resolve; was asserted
                                                           on 8 entries, plus invented
                                                           /maintenance and /investment
                                                           paths)
    - https://www.yardi.com/products/voyager/             (HTTP 404; real page is
                                                           /suite/voyager-suite/)
    - https://www.yardi.com/support/                      (HTTP 404)
    - https://www.yardi.com/contact-us/                   (HTTP 403)
    - https://www.yardi.com/about-us/legal/terms-of-use/  (HTTP 403)
    - https://www.rentcafe.com/api/                       (HTTP 403, no longer serves docs)
    - baseURL https://api.rentcafe.com                    (HTTP 403)

  Removed as unevidenced APIs — marketing products with no evidence of a named,
  separately documented API:
    - Yardi Maintenance IQ API   (maintenance is an interface category, covered by the
                                  Service Requests interface entry)
    - Yardi Investment Manager API

  accessModel corrected from onboarding: self-serve to onboarding: approval. There is
  no signup of any kind; the previous "Signup" property pointed at a partner
  application form and has been removed.

  The GitHubOrganization link is retained for completeness but carries no API value —
  github.com/YardiSystems holds 13 repositories, all forks of third-party projects
  (quill, FileSaver.js, websocketd, bolt.diy, rrule). Yardi publishes no first-party
  API artifacts there.

  See also all/yardi-canada, which was researched to this standard on 2026-07-26, and
  all/yardi-propware.
