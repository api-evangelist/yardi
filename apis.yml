apis:
- aid: yardi:yardi-virtuoso-connector-mcp
  name: Yardi Virtuoso Connector (MCP)
  description: >-
    Yardi's first-party Model Context Protocol server, announced in early access on
    2025-09-10 and described as generally available in Virtuoso Enterprise on
    2026-06-16. Listed on the Anthropic connector directory as Read & Write in the
    Financial services category. Published capabilities are portfolio performance
    analysis across properties and markets, financial data including Net Operating
    Income comparisons, work order management and tracking, invoice review and
    approval workflows, quarterly business review support, and budget forecasting.
    Authorization is real and anonymously discoverable — RFC 9728 protected-resource
    metadata and RFC 8414 authorization-server metadata on mcp.virtuoso.ai publish an
    OAuth 2.1 authorization-code flow with PKCE S256, refresh tokens and dynamic
    client registration. Those scopes carry identity only; Yardi states data access
    follows the caller's existing Yardi user permissions. The tool list is not
    anonymously introspectable and the technical documentation returns HTTP 401, so no
    tool names or input schemas are asserted here. Access requires a licensed,
    configured Virtuoso Enterprise tenancy — there is no trial and no developer
    sandbox. This is the most agent-ready surface Yardi operates.
  humanURL: https://claude.com/connectors/yardi-virtuoso
  baseURL: https://mcp.virtuoso.ai
