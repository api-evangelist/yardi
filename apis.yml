- aid: yardi:yardi-store-web-services-api
  name: Yardi Store Web Services API (SWS2)
  description: >-
    SOAP-based API for Yardi's self-storage management platform, formerly CenterShift.
    SWS2 provides tokenized authentication and store management methods for building
    custom applications and websites against Yardi Store Enterprise and Store
    Advantage. Notable as the only Yardi interface with genuine developer
    documentation readable by an anonymous visitor — the legacy centershiftdevx.com
    site publishes an endpoint list, an authentication overview and support contacts.
    The documentation has not been updated since 2017 and the site is not linked from
    yardi.com.
  humanURL: https://centershiftdevx.com/
