aid: yardi
name: Yardi
description: >-
  Yardi Systems, Inc. (Goleta, California) builds the investment and property
  management software that residential, commercial, affordable housing, public
  housing, military housing, self-storage, coworking and senior living operators run
  as their system of record — Voyager, Breeze, RentCafe, Elevate, Investment Suite,
  Matrix, Kube and Virtuoso. It sits on the systems-of-record rung of the real estate
  value chain: the ledger and operating platform a landlord or asset manager runs on,
  not a listing portal and not a registry operator.

  Its API posture, stated honestly, is licensed-access-only and partner-gated. There
  is no public developer portal — developer., developers., api. and docs. hosts do not
  resolve on yardi.com, and the /platform/ and /platform/api/ paths previously
  catalogued here return HTTP 404. Real interfaces exist in volume, but only behind
  the Voyager Standard Interface Partnership Program (SIPP): an application, a signed
  Data Exchange Agreement per interface type, a company at least two years old with
  three or more active Voyager clients, and an annual license fee per interface that
  is in some cases charged per transaction. A development sandbox is provided only
  after acceptance. The public "find an interface partner" page is a directory of
  450+ already-accepted vendors across twelve interface categories, not documentation
  — its only calls to action are "Talk to sales" and "Contact us".

  Three public, machine-readable or anonymously readable surfaces do exist, and none
  of them is the Voyager API. Yardi ships a first-party MCP server, the Virtuoso
  Connector, whose OAuth 2.1 authorization contract is published anonymously on
  mcp.virtuoso.ai even though its tool list is not. status.yardi.com runs a full
  Atlassian Statuspage with an unauthenticated JSON API across 134 components in 16
  product groups. And centershiftdevx.com, the legacy CenterShift developer site
  carried forward into Yardi Store, still serves genuine SWS2 endpoint documentation
  to anonymous readers — the only Yardi property that does.

  Every OpenAPI, JSON Schema, GraphQL schema, Postman collection and derived
  governance artifact in this repository was written by API Evangelist from Yardi's
  own interface naming and public partner documentation. Yardi publishes no OpenAPI,
  no WSDL, no OData $metadata and no machine-readable contract of any kind.
