- aid: yardi:yardi-rentcafe-api
  name: RentCafe API
  description: >-
    The RentCafe marketing, leasing and resident-services API. Yardi's published
    RentCafe API Terms of Use names concrete operations in its Schedule A —
    getapartmentavailability, getfloorplans, getunitpricingdetails, getpropertydetails,
    getamenities, getofficehours, createlead, getavailableslots and createappointment —
    and states that use "is by way of that certain RentCafe API Access Agreement
    between you and Yardi Systems, Inc." Access is restricted to vendors serving
    "Common Clients" (entities that are clients of both Yardi and the vendor), and the
    vendor may not pass Common Client Data to third parties. The Terms of Use is the
    only public artifact: no base URL, reference documentation, OpenAPI document or
    self-serve signup is published, api.rentcafe.com and www.rentcafe.com/api/ both
    return HTTP 403 to anonymous clients.
  humanURL: https://resources.yardi.com/legal/rc-api-tou/
