specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Yardi
providerId: yardi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Property Management
  - Real Estate
  - PropTech
  - Multifamily
description: Yardi does not publish a public price card for any of its products
  (Voyager, Breeze, RentCafe, Yardi Marketplace, etc.) or their associated APIs.
  Pricing is quoted via direct sales engagement and depends on portfolio size, modules,
  and deployment model.
sources:
  - https://www.yardi.com/products/
notes: |
  WebFetch of yardi.com confirmed no published pricing tiers; the site directs all
  pricing inquiries through "Talk to Sales". The developer portal (developer.yardi.com)
  was unreachable. Treated as B2B contact-sales.
plans:
  - id: yardi-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Yardi product and API commercial terms are negotiated directly
      with Yardi Sales; module bundles, transaction fees, and integration access vary
      by portfolio.
    entries:
      - label: Custom Commercial Terms
        name: custom
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Voyager / Breeze / RentCafe access
      - name: Yardi API integration enablement
      - name: Implementation and onboarding services
maintainers:
