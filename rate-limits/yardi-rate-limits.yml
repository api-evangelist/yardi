specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Yardi
providerId: yardi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Property Management
  - Real Estate
  - Rate Limiting
description: Yardi does not publish API rate limits on any public-facing page. Throttling
  exists at the Voyager / Breeze server tier and is enforced based on the customer's
  hosted environment and integration agreement, but no per-second or per-minute numbers
  are documented externally.
sources:
  - https://www.yardi.com/products/
responseCodes:
  throttled: 429
limits:
  - name: Per-tenant throttling (undocumented)
    scope: account
    metric: varies
    limit: see Yardi integration agreement
    notes: Limits are environment-specific (hosted Voyager database sizing, Breeze SaaS
      multitenancy). Published only to onboarded partners.
policies:
  - name: Partner-gated documentation
    description: Yardi rate-limit specifics are shared with integration partners under
      NDA via the Yardi Marketplace ISV / partner program, not the public website.
  - name: Backoff
    description: Clients should implement exponential backoff with jitter on 429 / 5xx
      responses and honor Retry-After when present.
maintainers:
