naftiko: "1.0.0-alpha1"

info:
  label: "Yardi Voyager API"
  description: >-
    Core property management platform API providing access to accounting,
    operations, and reporting functionality for real estate portfolios via
    SOAP-based web services.
  tags:
    - Accounting
    - Billing
    - Property Management
    - Real Estate
    - Yardi
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      YARDI_USERNAME: YARDI_USERNAME
      YARDI_PASSWORD: YARDI_PASSWORD
      YARDI_SERVER_NAME: YARDI_SERVER_NAME
      YARDI_DATABASE: YARDI_DATABASE
      YARDI_INTERFACE_ENTITY: YARDI_INTERFACE_ENTITY
      YARDI_INTERFACE_LICENSE: YARDI_INTERFACE_LICENSE

capability:
  consumes:
    - type: http
      namespace: yardi-voyager
      baseUri: https://www.yardiasp13.yardi.com/{clientUrl}/webservices
      description: "Yardi Voyager SOAP web services for property management"
      authentication:
        type: basic
        username: "{{YARDI_USERNAME}}"
        password: "{{YARDI_PASSWORD}}"
      resources:
        - name: billing-and-payments
          path: /ItfResidentTransactions20.asmx
          description: "Resident transaction and billing operations"
          operations:
            - name: get-resident-transactions
              method: POST
              description: "Retrieve resident transaction records for a property and date range"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: FromDate
                  in: body
                  type: string
                  required: false
                  description: "Start date for transaction query (YYYY-MM-DD)"
                - name: ToDate
                  in: body
                  type: string
                  required: false
                  description: "End date for transaction query (YYYY-MM-DD)"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-resident-transactions-by-charge-date
              method: POST
              description: "Retrieve resident transactions filtered by charge date"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: ChargeFromDate
                  in: body
                  type: string
                  required: false
                  description: "Start charge date"
                - name: ChargeToDate
                  in: body
                  type: string
                  required: false
                  description: "End charge date"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: import-resident-transactions
              method: POST
              description: "Import resident transactions into Voyager"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: TransactionXml
                  in: body
                  type: string
                  required: true
                  description: "XML payload containing transaction data"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-budget-data
              method: POST
              description: "Retrieve budget data for a property"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: BudgetName
                  in: body
                  type: string
                  required: false
                  description: "Budget name"
                - name: FiscalYear
                  in: body
                  type: string
                  required: false
                  description: "Fiscal year"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: common-data
          path: /ItfCommonData.asmx
          description: "Property, unit, tenant, and chart of accounts data"
          operations:
            - name: get-property-configurations
              method: POST
              description: "Retrieve property configuration data"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-unit-information
              method: POST
              description: "Retrieve unit information for a property"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-tenants
              method: POST
              description: "Retrieve tenant records for a property"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-chart-of-accounts
              method: POST
              description: "Retrieve chart of accounts for a property"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: service-requests
          path: /ItfServiceRequests.asmx
          description: "Maintenance work order and service request operations"
          operations:
            - name: get-service-requests
              method: POST
              description: "Retrieve service requests and work orders for a property"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: FromDate
                  in: body
                  type: string
                  required: false
                  description: "Start date"
                - name: ToDate
                  in: body
                  type: string
                  required: false
                  description: "End date"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: import-service-requests
              method: POST
              description: "Create or update service requests in Voyager"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: ServiceRequestXml
                  in: body
                  type: string
                  required: true
                  description: "XML payload containing service request data"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: vendor-invoicing
          path: /ItfVendorInvoice.asmx
          description: "Vendor invoice and accounts payable operations"
          operations:
            - name: get-vendor-invoices
              method: POST
              description: "Retrieve vendor invoice records"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: FromDate
                  in: body
                  type: string
                  required: false
                  description: "Start date"
                - name: ToDate
                  in: body
                  type: string
                  required: false
                  description: "End date"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: import-vendor-invoices
              method: POST
              description: "Import vendor invoices into Voyager accounts payable"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: InvoiceXml
                  in: body
                  type: string
                  required: true
                  description: "XML payload containing vendor invoice data"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: job-cost
          path: /ItfJobCost.asmx
          description: "Job cost tracking and construction project financials"
          operations:
            - name: get-job-cost-data
              method: POST
              description: "Retrieve job cost tracking data for a project"
              inputParameters:
                - name: YardiPropertyId
                  in: body
                  type: string
                  required: true
                  description: "Yardi property identifier"
                - name: JobId
                  in: body
                  type: string
                  required: false
                  description: "Job or project identifier"
              outputRawFormat: xml
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: yardi-voyager-api
      resources:
        - path: /v1/properties/{propertyId}/transactions
          name: transactions
          description: "Resident transactions for a property"
          operations:
            - method: GET
              name: get-transactions
              description: "Get resident transactions"
              call: "yardi-voyager.get-resident-transactions"
              with:
                YardiPropertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: import-transactions
              description: "Import resident transactions"
              call: "yardi-voyager.import-resident-transactions"
              with:
                YardiPropertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/properties/{propertyId}/units
          name: units
          description: "Unit information for a property"
          operations:
            - method: GET
              name: get-units
              description: "Get unit information"
              call: "yardi-voyager.get-unit-information"
              with:
                YardiPropertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/properties/{propertyId}/tenants
          name: tenants
          description: "Tenant records for a property"
          operations:
            - method: GET
              name: get-tenants
              description: "Get tenant records"
              call: "yardi-voyager.get-tenants"
              with:
                YardiPropertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/properties/{propertyId}/service-requests
          name: service-requests
          description: "Service requests and work orders"
          operations:
            - method: GET
              name: get-service-requests
              description: "Get service requests"
              call: "yardi-voyager.get-service-requests"
              with:
                YardiPropertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: yardi-voyager-mcp
      transport: http
      tools:
        - name: get-resident-transactions
          description: "Retrieve resident transaction records for a property"
          hints:
            readOnly: true
          call: "yardi-voyager.get-resident-transactions"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-unit-information
          description: "Retrieve unit details for a property"
          hints:
            readOnly: true
          call: "yardi-voyager.get-unit-information"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-tenants
          description: "Retrieve tenant records for a property"
          hints:
            readOnly: true
          call: "yardi-voyager.get-tenants"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-service-requests
          description: "Retrieve work orders and service requests"
          hints:
            readOnly: true
          call: "yardi-voyager.get-service-requests"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-vendor-invoices
          description: "Retrieve vendor invoices and accounts payable records"
          hints:
            readOnly: true
          call: "yardi-voyager.get-vendor-invoices"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-budget-data
          description: "Retrieve budget data for a property"
          hints:
            readOnly: true
          call: "yardi-voyager.get-budget-data"
          with:
            YardiPropertyId: "tools.property_id"
          outputParameters:
            - type: object
              mapping: "$."
